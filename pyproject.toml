[project]
name = "dream-challenge"
version = "0.1.0"
description = "DREAM challenge sequence expression modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "more-itertools>=10.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
